version: '3.9'

services:
  # PostgreSQL Database Service
  database:
    image: postgres:15-alpine
    container_name: dca_postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dca_backend
    env_file:
      - .env
    ports:
      - '8000:8000'
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src # For development hot reload (optional)

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    container_name: dca_frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    env_file:
      - .env
    restart: unless-stopped

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
