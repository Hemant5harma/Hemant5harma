<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3C50E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#80CAEE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Trading Chart Icon -->
  <g transform="translate(8, 8)">
    <!-- Chart bars -->
    <rect x="2" y="14" width="3" height="8" fill="url(#iconGradient)" rx="1"/>
    <rect x="7" y="10" width="3" height="12" fill="url(#iconGradient)" rx="1"/>
    <rect x="12" y="6" width="3" height="16" fill="url(#iconGradient)" rx="1"/>
    <rect x="17" y="12" width="3" height="10" fill="url(#iconGradient)" rx="1"/>
    
    <!-- Trend line -->
    <path d="M2 16 L7 12 L12 8 L17 14 L22 10" stroke="url(#iconGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arrow up -->
    <path d="M19 8 L22 5 L25 8" stroke="url(#iconGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg> 